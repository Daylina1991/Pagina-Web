        <h1 class="titulo-contacto text-secondary">Contactanos</h1>

        <form action="https://formspree.io/f/mojryjaz" method="POST" class="registration-form">    
           
                <label for="nombre">Nombre</label>
                <input class="controls" type="text" name="nombre" id="nombre" placeholder="Ingrese su nombre" required>
            
                <label for="apellido">Apellido</label>
                <input class="controls" type="text" name="apellido" id="apellido" placeholder="Ingrese su Apellido" required>
          
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="message" class="controls" placeholder="Deja tu mensaje..."></textarea>
            

            <button class="btn-enviar" type="submit">Enviar</button>
        </form>
    </main>
