<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/logods.jpg">
    <link rel="icon" href="../img/logods.jpg">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <title>Crear cuenta</title>
</head>
<body>

    <header>
        <div class="header-top">
            <a href="../index.html" class="logo">
                <img src="../img/logods.jpg" alt="Logo Indise">
            </a>
            <div class="header-search">
                <input type="text" placeholder="Buscar productos...">
                <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="header-promo">
                <p>REGISTRATE <span>Y OBTENÉ BENEFICIOS</span></p>
            </div>
        </div>

        <div class="header-bottom">
            <nav class="nav-links">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="../pages/formulario.html">Formulario</a></li>
                    <li><a href="../pages/categoria.html">Categoría</a></li>
                    <li><a href="../pages/ofertas.html">Ofertas</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="contenedor-principal">
        <section class="form-container">
            <form action="" class="form-contacto">
                <h2>Crea tu Cuenta</h2> 
                <p>Completá tus datos para empezar a comprar.</p>

                <input class="controls" type="text" name="nombre" placeholder="Nombre completo" required>
                <input class="controls" type="email" name="email" placeholder="Correo electrónico" required>
                <input class="controls" type="password" name="password" placeholder="Contraseña nueva" required>
                <input class="controls" type="number" name="telefono" placeholder="Teléfono de contacto">
                
                <textarea name="mensaje" class="controls" placeholder="¿Algún comentario adicional?" rows="4"></textarea>

                <input type="submit" value="Registrarme" class="btn-enviar">
            </form>
        </section>
    </main>

    <footer>
        <nav>
            <ul class="footer-list">
                <li>
                    <a href="https://wa.me/5491169541265" target="_blank">
                        <img src="../img/watsicon.jpg" alt="whatsapp" />
                    </a>
                </li>
                    <a href="https://facebook.com" target="_blank">
                        <img src="../img/faceicon.jpg" alt="face" />
                    </a>
                </li>
                </li>
                    <a href="https://instagram.com" target="_blank">
                        <img src="../img/instaicon.jpg" alt="insta" />
                    </a>
                </li>
            
                </li>
                    <a href="https://github.com/Daylina1991" target="_blank">
                        <img src="../img/github.jpg" alt="github" />
                    </a>
                </li>
                
            </ul>
        </nav>
        <div class="footer-bottom">
            <p>Derechos reservados &copy; 2026 | <strong>Indise Tech</strong></p>
        </div>
    </footer>

</body>
</html>
