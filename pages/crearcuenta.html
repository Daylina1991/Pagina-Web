<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logods.jpg">
    <link rel="stylesheet" href="../css/style.css">
    <title>Registro Tech</title>
</head>
<body>
    <header>
        <div class="header-top">
            <a href="../index.html" class="logo">
                <img src="../img/logods.jpg" alt="Logo Indise" class="logo-img">
            </a>

            <div class="menu-toggle" id="mobile-menu">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <nav class="nav-links" id="nav-links">
                <ul>
                    <li><a href="../index.html">Inicio</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                    <li><a href="categoria.html">Categorías <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="ofertas.html">Ofertas</a></li>
                </ul>
            </nav>
        </div>     
    </header> 

    <main class="main-content">
        <h1 class="titulo-contacto">Crear Cuenta</h1>

        <form action="https://formspree.io/f/mojryjaz" method="POST" class="registration-form">      
            <label for="nombre">Nombre</label>
            <input class="controls" type="text" name="nombre" id="nombre" placeholder="Ingrese su nombre" required>
            
            <label for="apellido">Apellido</label>
            <input class="controls" type="text" name="apellido" id="apellido" placeholder="Ingrese su Apellido" required>
            
            <label for="fechanas">Fecha de Nacimiento</label>
            <input class="controls" type="date" name="fechanas" id="fechanas" required>
            
            <label for="telefono">Teléfono / WhatsApp</label>
            <input class="controls" type="tel" name="telefono" id="telefono" placeholder="Ej: 1123456789">
            
            <label for="email">E-Mail</label>
            <input class="controls" type="email" name="email" id="email" placeholder="Ingrese su Correo" required>
            
            <label for="clave">Contraseña</label>
            <input class="controls" type="password" name="clave" id="clave" placeholder="Ingrese su contraseña" required>

            <p style="font-size: 1.3rem; margin: 0.5rem 0;">Estoy de acuerdo con <a href="#" style="color: #188e9d; text-decoration: none;">Términos y Condiciones</a></p>
            
            <button class="btn-add" type="submit" style="width: 100%; margin-top: 1rem;">Registrar</button>
            
            <p style="text-align: center; font-size: 1.4rem; margin-top: 1rem;"><a href="#" style="color: #188e9d; text-decoration: none;">¿Ya tengo cuenta?</a></p>
        </form>
    </main>

    <footer>
        <nav>
            <ul class="footer-list">
                <li>
                    <a href="https://wa.me/5491169541265" target="_blank" class="footer-link">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                </li>
                <li>
                    <a href="https://facebook.com" target="_blank" class="footer-link">
                        <i class="fa-brands fa-facebook"></i>
                    </a>
                </li>
                <li>
                    <a href="https://instagram.com" target="_blank" class="footer-link">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </li>
                <li>
                    <a href="https://github.com/Daylina1991" target="_blank" class="footer-link">
                        <i class="fa-brands fa-github"></i>
                    </a>
                </li>
            </ul>
        </nav>
        <div class="footer-bottom">
            <p>Derechos reservados &copy; 2026 | <strong>Indise Tech</strong></p>
        </div>
    </footer>

    <script>
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.getElementById('nav-links');
        if(mobileMenu && navLinks) {
            mobileMenu.addEventListener('click', () => {
                navLinks.classList.toggle('active');
            });
        }
    </script>
</body>
</html>
