<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logods.jpg">
    <link rel="stylesheet" href="../css/style.css">
    <title>Registro Tech</title>
</head>
<body>

    
    <header class="header-top">
    <nav class="header-menubar">
        <a href="../index.html" class="logo">
            <img src="../img/logods.jpg" alt="Logo Indise" class="logo-img">
        </a>

        <div class="nav-links">
            <a href="../index.html">Inicio</a>
            <a href="contacto.html">Contacto</a>
            <a href="categoria.html">Categoría</a>
            <a href="ofertas.html">Ofertas</a>
        </div>
    </nav> 
</header>

   
    <main class="main-content">
        
        <section class="form-container">
            
           
            <div class="form-header">
                <h2>Crea tu cuenta</h2>
    
            </div>
            
            <form action="https://formspree.io/f/mojryjaz" method="POST" class="registration-form">
            <input type="hidden" name="_next" value="https://tuweb.com/pages/gracias.html">   
               
                <fieldset class="input-section">
                    <div class="input-field">
                        <label for="nombre">Nombre</label>
                        <input type="text" name="nombre" id="nombre" required>
                        <span class="help-text"></span>
                    </div>

                    <div class="input-field">
                        <label for="apellido">Apellido</label>
                        <input type="text" name="apellido" id="apellido" required>
                        <span class="help-text"></span>
                    </div>
                </fieldset>

               
                <fieldset class="input-section">
                    <div class="input-field">
                        <label for="email">Correo electrónico</label>
                        <input type="email" name="email" id="email" required>
                    </div>

                    <div class="input-field">
                        <label for="clave">Contraseña</label>
                        <input type="password" name="clave" id="clave" minlength="8" required>
                        <span class="help-text"></span>
                    </div>
                </fieldset>

               
                <div class="form-actions">
                    <div class="checkbox-group">
                        <input type="checkbox" name="terminos" id="terminos" required>
                        <label for="terminos">Acepto los <a href="#">Términos y Condiciones</a></label>
                    </div>

                    <button type="submit" class="botons">Crear cuenta</button>
                    
                    <p class="login-prompt">¿Ya tienes una cuenta? <a href="#">Inicia sesión</a></p>
                </div>

            </form>
        </section>

    </main>
    <footer class="main-footer">
    <div class="footer-wrapper">
        <p>Seguinos en nuestras redes sociales</p>
        
        <nav class="footer-list">
         
            <a href="https://wa.me/5491169541265" target="_blank" aria-label="Whatsapp">
                <i class="fa-brands fa-whatsapp"></i>
            </a>

           
            <a href="https://facebook.com" target="_blank" aria-label="Facebook">
                <i class="fa-brands fa-facebook"></i>
            </a>

      
            <a href="https://instagram.com" target="_blank" aria-label="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

          
            <a href="https://github.com/Daylina1991" target="_blank" aria-label="Github">
                <i class="fa-brands fa-github"></i>
            </a>
        </nav>

        <div class="footer-bottom">
            <p>Derechos reservados &copy; 2026 | <strong>Indise Tech</strong></p>
        </div>
    </div>
</footer> 

</body>
</html>
